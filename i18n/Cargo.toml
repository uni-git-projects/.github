[package]
name = "gh-profile-i18n"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
comrak = { version = "1.2", default-features = false }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
unicode-segmentation = "1.13"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
